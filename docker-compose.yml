name: bioauth-optimizer

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bioauth
      POSTGRES_USER: bioauth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bioauth}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432" # для локальной разработки; редкий порт, чтобы не конфликтовать с установленным PostgreSQL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bioauth -d bioauth"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql://bioauth:${POSTGRES_PASSWORD:-bioauth}@db:5432/bioauth
      PORT: 4000
      CORS_ORIGIN: http://localhost:3000
      MAX_UPLOAD_MB: 50
      LOG_LEVEL: info
      NODE_ENV: production
      BIO_ENGINE_URL: http://bio-engine:8000
      BIO_ENGINE_SECRET: ${BIO_ENGINE_SECRET:-dev-bio-secret-change-me}
      # Ключи шаблонов (ADR-0014): задайте TEMPLATE_KEYS='{"k1":"<base64 32 байта>"}' вне демо-стенда.
      TEMPLATE_KEYS: ${TEMPLATE_KEYS:-}
      ALLOW_DEV_KEYS: ${ALLOW_DEV_KEYS:-true}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-admin-123}
      RP_ID: ${RP_ID:-localhost}
      RP_ORIGIN: ${RP_ORIGIN:-http://localhost:3000}
    ports:
      - "4000:4000"
    networks: [default, internal]
    depends_on:
      db:
        condition: service_healthy
      bio-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  # Сервис распознавания: только во внутренней сети, порт наружу не публикуется (docs/10 §10.8).
  bio-engine:
    build:
      context: services/bio-engine
    environment:
      BIO_SECRET: ${BIO_ENGINE_SECRET:-dev-bio-secret-change-me}
      BIO_LOG_LEVEL: INFO
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        API_INTERNAL_URL: http://api:4000
        NEXT_PUBLIC_SWAGGER_URL: http://localhost:4000/api/docs
        NEXT_PUBLIC_SITE_URL: ${RP_ORIGIN:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

networks:
  internal:
    internal: true

volumes:
  pgdata:
