name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Типы, тесты, сборка
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bioauth_test
          POSTGRES_USER: bioauth
          POSTGRES_PASSWORD: bioauth
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bioauth -d bioauth_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://bioauth:bioauth@localhost:5432/bioauth_test
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Сообщения коммитов (commitlint)
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      - name: Форматирование (Prettier)
        run: pnpm format:check
      - run: pnpm turbo run build
      - name: Линтер (ESLint strict + steiger FSD)
        run: pnpm lint
      - run: pnpm turbo run typecheck
      - name: Тесты (ядро, контракты, API с e2e на PostgreSQL)
        run: pnpm turbo run test

  bio-engine:
    name: bio-engine (Python, модели ONNX)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/bio-engine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/bio-engine/requirements*.txt
      - uses: actions/cache@v4
        with:
          path: |
            services/bio-engine/models/face_detection_yunet_2023mar.onnx
            services/bio-engine/models/face_recognition_sface_2021dec.onnx
          key: bio-models-${{ hashFiles('services/bio-engine/models.lock.json') }}
      - run: pip install -r requirements-dev.txt
      - name: Модели (проверка SHA-256)
        run: python scripts/fetch_models.py
      - name: Линтер и форматирование (ruff)
        run: ruff check . && ruff format --check .
      - name: Типы (mypy --strict)
        run: mypy
      - name: Тесты (unit, контракт, модели на эталонных изображениях)
        run: pytest -v

  docker:
    name: Docker Compose + e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [test, bio-engine]
    steps:
      - uses: actions/checkout@v7
      - name: Сборка и запуск всех сервисов
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Проверка API
        run: |
          curl -fsS http://localhost:4000/health/ready
          curl -fsS http://localhost:3000/ > /dev/null
          curl -fsS http://localhost:3000/api/v1/examples/sro1 > /dev/null
          curl -fsS http://localhost:3000/api/v1/consent/text > /dev/null
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bioauth/web exec playwright install --with-deps chromium
      - name: ffmpeg для видео поддельной камеры
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg)
      - name: E2E против контейнеров (расчёты, живая биометрия с поддельной камерой и виртуальным аутентификатором)
        run: pnpm --filter @bioauth/web test:e2e
        env:
          E2E_BIOMETRICS: "1"
      - name: Трассировки Playwright при ошибке
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7
      - name: Логи при ошибке
        if: failure()
        run: docker compose logs --no-color
