name: Образы в GHCR

# По тегу v* собирает и публикует образы api, web и bio-engine в GitHub Container Registry:
#   ghcr.io/<владелец>/bioauth-optimizer-api:<версия> и :latest (и так же -web, -bio-engine).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            file: docker/api.Dockerfile
          - name: web
            context: .
            file: docker/web.Dockerfile
          - name: bio-engine
            context: services/bio-engine
            file: services/bio-engine/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/bioauth-optimizer-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=BioAuth Optimizer ${{ matrix.name }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          # web собирается с адресом API внутри сети compose, как в docker-compose.yml.
          build-args: |
            API_INTERNAL_URL=http://api:4000
            NEXT_PUBLIC_API_DOCS_URL=http://localhost:4000/api/docs
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
