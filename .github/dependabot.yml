# Обновления зависимостей. Мажорные версии, которые требуют перевода на ESM или ждут поддержки плагинов, перечислены
# в ignore с причиной; cooldown согласован с minimumReleaseAge в pnpm-workspace.yaml.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message: { prefix: "chore(deps)" }
    # Версия предлагается, только когда ей не меньше трёх дней: pnpm (minimumReleaseAge) не ставит свежие версии,
    # и обновление без паузы падало бы с ERR_PNPM_NO_MATURE_MATCHING_VERSION.
    cooldown:
      default-days: 3
    ignore:
      # kysely 0.29 — только ESM: API на CommonJS (NestJS) и Jest 30 его не загружают без перевода проекта на ESM.
      - dependency-name: kysely
        versions: [">=0.29.0"]
      # NestJS 12 (и @nestjs/swagger 12, @nestjs/cli 12) — только ESM: нужен перевод API на ESM.
      - dependency-name: "@nestjs/*"
        update-types: ["version-update:semver-major"]
      # ESLint 10 пока не поддерживают eslint-plugin-react и eslint-plugin-jsx-a11y.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 не поддерживают typescript-eslint (< 6.1) и ts-jest (< 7).
      - dependency-name: typescript
        versions: [">=7.0.0"]
      # Типы Node.js — по версии среды выполнения (Node.js 24 LTS).
      - dependency-name: "@types/node"
        versions: [">=25.0.0"]
  - package-ecosystem: pip
    directory: /services/bio-engine
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    commit-message: { prefix: "chore(deps)" }
    cooldown:
      default-days: 3
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: "chore(ci)" }
    cooldown:
      default-days: 3
  - package-ecosystem: docker
    directory: /docker
    schedule: { interval: monthly }
    commit-message: { prefix: "chore(docker)" }
    cooldown:
      default-days: 3
    ignore:
      # Нечётные версии Node.js не получают LTS и в 25 убран corepack, которым образы ставят pnpm.
      - dependency-name: node
        versions: ["25.x", "27.x", "29.x"]
